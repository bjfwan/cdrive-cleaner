[package]
name = "cdrive-cleaner"
version = "0.1.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cdrive_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 启用 `cdrive_cleaner_lib::bench` 模块（统计工具），仅供基准测试 / 工具脚本使用。
bench = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.35", features = ["full"] }
windows = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_RestartManager",
    "Win32_System_Com"
] }
jwalk = "0.8"
rayon = "1.8"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
junction = "1.0"
winreg = "0.55.0"
sysinfo = "0.38.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
trash = "5"
twox-hash = "2"
thiserror = "2"
dashmap = "6"
bincode = "1"
aho-corasick = "1"
zip = "0.6"

[dev-dependencies]
serial_test = "3"

# ─── Build Profiles ───────────────────────────────────────────────────────────

[profile.release]
lto = "thin"          # 跨 crate 内联，不用 fat（与 Tauri WebView2 链接兼容性问题）
codegen-units = 1     # 最大优化（牺牲编译时间）
strip = "symbols"     # 移除符号表，减小体积（避免 strip = true 的 Windows debuginfo 问题）
opt-level = 3         # 最大运行时性能
panic = "abort"       # 不需要 unwind，减小体积约 10%

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2         # 依赖库 O2 编译（只编译一次），自己的代码 O0 快速迭代
