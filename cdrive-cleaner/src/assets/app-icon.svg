<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主背景渐变 - 从红到蓝 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- C 形状渐变 - 红色调 -->
    <linearGradient id="diskCGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:0.85" />
    </linearGradient>
    
    <!-- D 形状渐变 - 蓝色调 -->
    <linearGradient id="diskDGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:0.85" />
    </linearGradient>
    
    <!-- 闪电渐变 - 从红到蓝 -->
    <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- 稀疏条纹图案 - 空间感 -->
    <pattern id="sparseStripePattern" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="none"/>
      <rect width="3" height="8" fill="#3b82f6" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- 圆角背景 - 橙到蓝渐变 -->
  <rect 
    x="8" 
    y="8" 
    width="104" 
    height="104" 
    rx="22" 
    fill="url(#bgGradient)"
  />
  
  <!-- 核心图形：C + 闪电 + D -->
  <g transform="translate(60, 60)">
    <!-- C 形状 - 左侧 -->
    <g transform="translate(-18, 0)">
      <path 
        d="M 8 -22 
           A 22 22 0 1 0 8 22
           L 8 15
           A 15 15 0 1 1 8 -15
           Z"
        fill="url(#diskCGradient)"
      />
    </g>
    
    <!-- 横向闪电 - 中间 -->
    <g transform="translate(0, 0)">
      <path 
        d="M -12 1 L 0 -4 L 0 0 L 12 -1 L 0 5 L 0 1 Z" 
        fill="url(#lightningGradient)"
      />
    </g>
    
    <!-- D 形状 - 右侧 -->
    <g transform="translate(22, 0)">
      <path 
        d="M -8 -22 
           L -8 22
           A 22 22 0 0 0 -8 -22
           Z"
        fill="url(#diskDGradient)"
      />
      <!-- 内圈 - 稀疏条纹 -->
      <path 
        d="M -8 -15 
           L -8 15
           A 15 15 0 0 0 -8 -15
           Z"
        fill="url(#sparseStripePattern)"
      />
      <!-- 分离线 -->
      <path 
        d="M -8 -15 
           L -8 15
           A 15 15 0 0 0 -8 -15"
        stroke="#3b82f6"
        stroke-width="1"
        fill="none"
        opacity="0.6"
      />
    </g>
  </g>
</svg>
